[workspace]
members = ["lib", "main"]
resolver = "2"

[profile.release]
opt-level = 2
lto = "thin"
incremental = false
panic = 'abort'

[profile.bench]
opt-level = 3
debug = false
rpath = false
lto = "thin"
incremental = true
debug-assertions = false

[profile.dev]
opt-level = 3
panic = 'abort'

[profile.test]
opt-level = 3
lto = "thin"
incremental = true
debug-assertions = true
debug = true